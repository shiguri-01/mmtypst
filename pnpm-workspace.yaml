packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@adobe/react-spectrum": ^3.47.5
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@react-spectrum/s2": ^1.7.1
  "@types/node": ^24
  solid-js: ^1.9.15
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plugin-solid: ^2.11.14
  vite-plus: 1.0.0-rc.0
  wrangler: ^4.133.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true

name: Publish

on:
  push:
    tags: ["mmtypst-v*", "react-v*", "solid-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile

      - name: Select and verify package
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            mmtypst-v*) directory=packages/mmtypst; package=mmtypst; version="${GITHUB_REF_NAME#mmtypst-v}" ;;
            react-v*) directory=packages/react; package=@mmtypst/react; version="${GITHUB_REF_NAME#react-v}" ;;
            solid-v*) directory=packages/solid; package=@mmtypst/solid; version="${GITHUB_REF_NAME#solid-v}" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          PACKAGE_DIR="$directory" PACKAGE_NAME="$package" RELEASE_VERSION="$version" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const { name, version } = JSON.parse(readFileSync(`${process.env.PACKAGE_DIR}/package.json`, "utf8"));
            assert.equal(name, process.env.PACKAGE_NAME, "Tag must select the expected package");
            assert.equal(version, process.env.RELEASE_VERSION, "Tag must match the package version");
          '
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - run: vp run ready

      - name: Stage npm package
        working-directory: ${{ steps.release.outputs.directory }}
        run: vp pm stage publish --access public --provenance --tag latest -- --no-git-checks

      - name: Summarize approval step
        run: |
          echo "Review and approve the staged npm package before creating a GitHub Release for $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"

name: Publish

on:
  push:
    tags: ["mmtypst@*", "@mmtypst/react@*", "@mmtypst/solid@*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile

      - name: Select and verify package
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            mmtypst@*) directory=packages/mmtypst; package=mmtypst; version="${GITHUB_REF_NAME#mmtypst@}" ;;
            @mmtypst/react@*) directory=packages/react; package=@mmtypst/react; version="${GITHUB_REF_NAME#@mmtypst/react@}" ;;
            @mmtypst/solid@*) directory=packages/solid; package=@mmtypst/solid; version="${GITHUB_REF_NAME#@mmtypst/solid@}" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          PACKAGE_DIR="$directory" PACKAGE_NAME="$package" RELEASE_VERSION="$version" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const { name, version } = JSON.parse(readFileSync(`${process.env.PACKAGE_DIR}/package.json`, "utf8"));
            assert.equal(name, process.env.PACKAGE_NAME, "Tag must select the expected package");
            assert.equal(version, process.env.RELEASE_VERSION, "Tag must match the package version");
          '
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: vp run ready

      - name: Stage npm package
        working-directory: ${{ steps.release.outputs.directory }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then tag=next; fi
          vp pm stage publish --access public --provenance --tag "$tag" -- --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${args[@]}"

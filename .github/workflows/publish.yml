name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Verify release version
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const { version } = JSON.parse(readFileSync("packages/mmtypst/package.json", "utf8")); assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, "Tag must match the package version");'
      - run: vp run ready
      - name: Stage npm package
        working-directory: packages/mmtypst
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          vp pm stage publish --access public --provenance --tag "$tag" -- --no-git-checks
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${args[@]}"
